name: Build and publish containers
on:
  push:
    branches: [main]
    paths: ["applytrack/**", ".github/workflows/build-publish.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./applytrack/backend
          push: true
          tags: ghcr.io/${{ github.repository_owner.toLowerCase() }}/applytrack-api:latest
