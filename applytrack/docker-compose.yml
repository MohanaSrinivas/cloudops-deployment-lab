services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-applytrack}
      POSTGRES_USER: ${POSTGRES_USER:-applytrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-applytrack} -d ${POSTGRES_DB:-applytrack}"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-applytrack}:${POSTGRES_PASSWORD:-change-me-locally}@db:5432/${POSTGRES_DB:-applytrack}
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-secret}
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}}
  web:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev"
    environment: {VITE_API_URL: http://localhost:8000}
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  postgres_data:
